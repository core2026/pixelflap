<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>PixelJump - v1.5.0</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background-color: #121212;
      color: #ffffff;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
    }
    #game-container {
      position: relative;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.7);
      border-radius: 8px;
      overflow: hidden;
    }
    canvas {
      display: block;
      background-color: #70c5ce;
    }
    .ui-panel {
      margin-top: 10px;
      display: flex;
      gap: 15px;
      align-items: center;
      font-size: 14px;
    }
    button, label.btn {
      background: #2e7d32;
      color: white;
      border: none;
      padding: 6px 12px;
      border-radius: 4px;
      cursor: pointer;
      font-weight: bold;
      font-size: 12px;
    }
    button:hover, label.btn:hover {
      background: #388e3c;
    }
    input[type="file"] {
      display: none;
    }
    .instructions {
      margin-top: 8px;
      font-size: 13px;
      color: #aaa;
      text-align: center;
    }
  </style>
</head>
<body>

  <div id="game-container">
    <canvas id="gameCanvas" width="400" height="600"></canvas>
  </div>

  <div class="ui-panel">
    <button id="audioToggle">🔊 Mute Audio</button>
    <label for="avatarUpload" class="btn">📁 Custom Avatar</label>
    <input type="file" id="avatarUpload" accept="image/*">
  </div>

  <div class="instructions">
    <p>Starts with 🛡️ <strong>Shield</strong>! Grab ⚔️ <strong>Sword</strong> to trigger <strong>Knight Rampage</strong>!</p>
  </div>

  <!-- Asset version bumped to v1.5.0 -->
  <script src="game.js?v=1.5.0"></script>
</body>
</html>
