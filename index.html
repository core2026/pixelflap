<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>PixelJump - Dynamic Cosmic Flight</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="game-container">
    <canvas id="gameCanvas" width="400" height="600"></canvas>

    <!-- Pre-game Customization Screen -->
    <div id="start-screen" class="overlay">
      <h1 class="title">PIXEL JUMP</h1>
      
      <div class="input-group">
        <label for="player-initials">Enter Initials (1-3 Chars):</label>
        <input type="text" id="player-initials" maxlength="3" placeholder="ACE" autocomplete="off">
      </div>

      <div class="input-group">
        <label>Select Avatar:</label>
        <div class="avatar-selector">
          <button class="avatar-btn active" data-avatar="🚀">🚀</button>
          <button class="avatar-btn" data-avatar="🛸">🛸</button>
          <button class="avatar-btn" data-avatar="👾">👾</button>
          <button class="avatar-btn" data-avatar="👻">👻</button>
        </div>
      </div>

      <div class="input-group">
        <label for="custom-avatar-input">Or Upload Custom Avatar (Image):</label>
        <input type="file" id="custom-avatar-input" accept="image/*">
      </div>

      <button id="start-btn" class="btn">START GAME</button>
    </div>

    <!-- Game Over Screen & Leaderboard -->
    <div id="game-over-screen" class="overlay hidden">
      <h2>GAME OVER</h2>
      <p id="final-score">Score: 0</p>

      <div id="leaderboard-box">
        <h3>Top High Scores</h3>
        <ol id="leaderboard-list">
          <li class="loading">Loading scores...</li>
        </ol>
      </div>

      <button id="restart-btn" class="btn">PLAY AGAIN</button>
    </div>
  </div>

  <script src="game.js"></script>
</body>
</html>
