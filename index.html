<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>PixelJump - v1.10.0</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    html, body {
      width: 100%;
      height: 100%;
      background-color: #121212;
      color: #ffffff;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      padding: 10px;
    }
    #game-container {
      position: relative;
      width: 100%;
      max-width: 420px;
      max-height: 85vh;
      aspect-ratio: 2 / 3;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.7);
      border-radius: 12px;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
      background-color: #000;
    }
    canvas {
      width: 100%;
      height: 100%;
      display: block;
      background-color: #70c5ce;
      object-fit: contain;
    }
    .ui-panel {
      margin-top: 10px;
      display: flex;
      gap: 10px;
      align-items: center;
      justify-content: center;
      flex-wrap: wrap;
    }
    button, label.btn {
      background: #2e7d32;
      color: white;
      border: none;
      padding: 6px 12px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
      font-size: 12px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.3);
      transition: background 0.2s;
    }
    button:hover, label.btn:hover {
      background: #388e3c;
    }
    input[type="file"] {
      display: none;
    }
    .instructions {
      margin-top: 6px;
      font-size: 11px;
      color: #aaa;
      text-align: center;
    }
  </style>
</head>
<body>

  <div id="game-container">
    <canvas id="gameCanvas" width="400" height="600"></canvas>
  </div>

  <div class="ui-panel">
    <button id="audioToggle">🔊 Mute Audio</button>
    <label for="avatarUpload" class="btn">📁 Custom Avatar</label>
    <input type="file" id="avatarUpload" accept="image/*">
  </div>

  <div class="instructions">
    <p>Starts with 🛡️ <strong>Shield</strong>! Grab ⏳ <strong>Slow Time</strong>, 💎 <strong>Gem Multiplier</strong>, or ⚔️ <strong>Sword</strong> for Knight Rampage!</p>
  </div>

  <script src="game.js?v=1.10.0"></script>
</body>
</html>
