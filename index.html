<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>PixelJump</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="game-container">
    <canvas id="gameCanvas"></canvas>

    <!-- UI Overlay: Character Select & Splash -->
    <div id="character-select" class="overlay">
      <h1>PIXELJUMP</h1>
      <p class="subtitle">Select or upload your character:</p>
      
      <div class="character-grid">
        <button class="char-btn active" data-char="cat">
          <div class="char-preview cat-icon"></div>
          <span>Cat</span>
        </button>
        <button class="char-btn" data-char="dog">
          <div class="char-preview dog-icon"></div>
          <span>Dog</span>
        </button>
        <button class="char-btn" data-char="star">
          <div class="char-preview star-icon"></div>
          <span>Star</span>
        </button>
      </div>

      <!-- Custom Image Upload Feature -->
      <div class="upload-section">
        <label for="imageUpload" class="upload-label">📁 Upload Custom Avatar</label>
        <input type="file" id="imageUpload" accept="image/*" />
        <span id="uploadStatus"></span>
      </div>

      <div class="name-input-group">
        <input 
          type="text" 
          id="playerName" 
          placeholder="AAA" 
          maxlength="3" 
          autocomplete="off"
          style="text-transform: uppercase;"
        />
      </div>

      <button id="startBtn" class="primary-btn">Tap / Click to Play</button>
    </div>

    <!-- UI Overlay: Game Over & Live Leaderboard -->
    <div id="game-over" class="overlay hidden">
      <h2>GAME OVER</h2>
      <div class="score-summary">
        <p>Score: <span id="finalScore">0</span></p>
        <p>Best: <span id="bestScore">0</span></p>
      </div>

      <div class="leaderboard-box">
        <h3>🏆 High Scores</h3>
        <ul id="leaderboardList">
          <li>Loading scores...</li>
        </ul>
      </div>

      <div class="button-group">
        <button id="retryBtn" class="primary-btn">Play Again</button>
        <button id="changeCharBtn" class="secondary-btn">Change Character</button>
      </div>
    </div>
  </div>

  <script src="game.js"></script>
</body>
</html>
