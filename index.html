<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>PixelJump - v1.3.0</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background-color: #121212;
      color: #ffffff;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
    }
    #game-container {
      position: relative;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
      border-radius: 8px;
      overflow: hidden;
    }
    canvas {
      display: block;
      background-color: #70c5ce;
    }
    .instructions {
      margin-top: 12px;
      font-size: 14px;
      color: #aaa;
      text-align: center;
    }
  </style>
</head>
<body>

  <div id="game-container">
    <canvas id="gameCanvas" width="400" height="600"></canvas>
  </div>

  <div class="instructions">
    <p>Collect 🛡️ <strong>Shield</strong> + ⚔️ <strong>Sword</strong> to unleash the <strong>Medieval Knight</strong>!</p>
  </div>

  <!-- Asset version bumped to v1.3.0 to bypass old browser & Cloudflare caches -->
  <script src="game.js?v=1.3.0"></script>
</body>
</html>
