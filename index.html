<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>PixelJump - v1.13.0</title>

  <!-- Game Favicon -->
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%230f172a'/><circle cx='50' cy='50' r='38' fill='%23059669'/><circle cx='50' cy='50' r='28' fill='%2310b981'/><text x='50' y='64' font-size='42' text-anchor='middle' fill='white'>🚀</text></svg>">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    html, body {
      width: 100%;
      height: 100%;
      background-color: #0f172a;
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      padding: 10px;
    }
    #game-container {
      position: relative;
      width: 100%;
      max-width: 500px;
      height: 90vh;
      max-height: 850px;
      aspect-ratio: 9 / 16;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.8), 0 0 20px rgba(16, 185, 129, 0.2);
      border-radius: 16px;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
      background-color: #020617;
      border: 1px solid rgba(255, 255, 255, 0.1);
    }
    canvas {
      width: 100%;
      height: 100%;
      display: block;
      background-color: #38bdf8;
      object-fit: contain;
    }
    /* Hidden file input triggered programmatically at game over / splash */
    input[type="file"] {
      display: none;
    }
  </style>
</head>
<body>

  <div id="game-container">
    <canvas id="gameCanvas" width="450" height="750"></canvas>
  </div>

  <input type="file" id="avatarUpload" accept="image/*">

  <script src="game.js?v=1.13.0"></script>
</body>
</html>
