<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>pixelflap</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="game-container">
    <canvas id="game-canvas" width="400" height="600"></canvas>

    <div id="score-hud">0</div>

    <div id="start-screen" class="overlay">
      <h1>pixelflap</h1>
      <p>choose your character</p>
      <div id="character-select">
        <button class="char-option" data-character="pac">
          <canvas class="char-preview" width="60" height="60"></canvas>
          <span>muncher</span>
        </button>
        <button class="char-option" data-character="cat">
          <canvas class="char-preview" width="60" height="60"></canvas>
          <span>cat</span>
        </button>
        <button class="char-option" data-character="dog">
          <canvas class="char-preview" width="60" height="60"></canvas>
          <span>dog</span>
        </button>
      </div>
      <p>tap, click, or press space to flap</p>
      <button id="start-btn">play</button>
    </div>

    <div id="game-over-screen" class="overlay hidden">
      <h1>game over</h1>
      <p id="final-score">score: 0</p>
      <p id="best-score">best: 0</p>
      <button id="retry-btn">retry</button>
    </div>
  </div>

  <script src="game.js"></script>
</body>
</html>
